name: Build Obico Images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./source/backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tylonhh/obico-backend:${{ github.sha }}
            ghcr.io/tylonhh/obico-backend:latest

      - name: Build and push ml_api image
        uses: docker/build-push-action@v6
        with:
          context: ./source/ml_api
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ghcr.io/tylonhh/obico-ml-api:${{ github.sha }}
            ghcr.io/tylonhh/obico-ml-api:latest
