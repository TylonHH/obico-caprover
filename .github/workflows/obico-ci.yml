name: Build Obico Images
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodule: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Login to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push backend image
        uses: docker/build-push-action@v4
        with:
          context: ./source/backend
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/obico-backend:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/obico-backend:latest
      - name: Build and push ml_api image
        uses: docker/build-push-action@v4
        with:
          context: ./source/ml_api
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/obico-ml_api:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/obico-ml_api:latest
