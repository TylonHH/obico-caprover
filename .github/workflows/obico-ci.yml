name: Build Obico Images

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: obico-images-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./source/backend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/tylonhh/obico-backend:${{ github.sha }}
            ghcr.io/tylonhh/obico-backend:latest
          cache-from: type=gha,scope=obico-backend
          cache-to: type=gha,mode=max,scope=obico-backend

      - name: Build ml_api image
        uses: docker/build-push-action@v6
        with:
          context: ./source/ml_api
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/tylonhh/obico-ml-api:${{ github.sha }}
            ghcr.io/tylonhh/obico-ml-api:latest
          cache-from: type=gha,scope=obico-ml-api
          cache-to: type=gha,mode=max,scope=obico-ml-api
