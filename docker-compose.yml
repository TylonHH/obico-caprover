captainVersion: 4

services:
  $$cap_appname-postgres:
    image: postgres:16-alpine
    restart: always
    volumes:
      - $$cap_appname-postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: obico
      POSTGRES_PASSWORD: $$cap_postgres_password
      POSTGRES_DB: obico
      PGDATA: /var/lib/postgresql/data
    caproverExtra:
      notExposeAsWebApp: 'true'

  $$cap_appname-redis:
    image: redis:7.2-alpine
    restart: always
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --requirepass
      - $$cap_redis_password
    volumes:
      - $$cap_appname-redis-data:/data
    caproverExtra:
      notExposeAsWebApp: 'true'

  $$cap_appname-backend:
    image: ghcr.io/tylonhh/obico-backend:latest
    restart: always
    depends_on:
      - $$cap_appname-postgres
      - $$cap_appname-redis
      - $$cap_appname-ml-api
    command:
      - sh
      - -c
      - >-
        python manage.py migrate &&
        python manage.py shell -c "from django.contrib.sites.models import Site; Site.objects.update_or_create(id=1, defaults={'domain': '$$cap_public_host', 'name': '$$cap_public_host'})" &&
        python manage.py collectstatic -v 2 --noinput &&
        daphne -b 0.0.0.0 -p 3334 config.routing:application
    environment:
      DATABASE_URL: postgres://obico:$$cap_postgres_password@srv-captain--$$cap_appname-postgres:5432/obico
      REDIS_URL: redis://:$$cap_redis_password@srv-captain--$$cap_appname-redis:6379
      INTERNAL_MEDIA_HOST: http://srv-captain--$$cap_appname-backend:3334
      ML_API_HOST: http://srv-captain--$$cap_appname-ml-api:3333
      ML_API_TOKEN: $$cap_ml_api_token
      DJANGO_SECRET_KEY: $$cap_django_secret_key
      OCTOPRINT_TUNNEL_PORT_RANGE: '0-0'
      DEBUG: 'False'
      SITE_USES_HTTPS: 'True'
      SITE_IS_PUBLIC: 'True'
      ACCOUNT_ALLOW_SIGN_UP: 'True'
      WEBPACK_LOADER_ENABLED: 'False'
      CSRF_TRUSTED_ORIGINS: https://$$cap_public_host
      DEFAULT_FROM_EMAIL: $$cap_default_from_email
      EMAIL_HOST: $$cap_email_host
      EMAIL_HOST_USER: $$cap_email_host_user
      EMAIL_HOST_PASSWORD: $$cap_email_host_password
      EMAIL_PORT: $$cap_email_port
      EMAIL_USE_TLS: $$cap_email_use_tls
    caproverExtra:
      containerHttpPort: '3334'

  $$cap_appname-worker:
    image: ghcr.io/tylonhh/obico-backend:latest
    restart: always
    depends_on:
      - $$cap_appname-postgres
      - $$cap_appname-redis
    command:
      - sh
      - -c
      - celery -A config worker --beat -l info -c 2 -Q realtime,celery
    environment:
      DATABASE_URL: postgres://obico:$$cap_postgres_password@srv-captain--$$cap_appname-postgres:5432/obico
      REDIS_URL: redis://:$$cap_redis_password@srv-captain--$$cap_appname-redis:6379
      INTERNAL_MEDIA_HOST: http://srv-captain--$$cap_appname-backend:3334
      ML_API_HOST: http://srv-captain--$$cap_appname-ml-api:3333
      ML_API_TOKEN: $$cap_ml_api_token
      DJANGO_SECRET_KEY: $$cap_django_secret_key
      OCTOPRINT_TUNNEL_PORT_RANGE: '0-0'
      DEBUG: 'False'
      SITE_USES_HTTPS: 'True'
      SITE_IS_PUBLIC: 'True'
      ACCOUNT_ALLOW_SIGN_UP: 'True'
      WEBPACK_LOADER_ENABLED: 'False'
    caproverExtra:
      notExposeAsWebApp: 'true'

  $$cap_appname-ml-api:
    image: ghcr.io/tylonhh/obico-ml-api:latest
    restart: always
    command:
      - bash
      - -c
      - gunicorn --bind 0.0.0.0:3333 --workers 1 wsgi
    environment:
      DEBUG: 'True'
      FLASK_APP: server.py
      ML_API_TOKEN: $$cap_ml_api_token
    caproverExtra:
      notExposeAsWebApp: 'true'

caproverOneClickApp:
  variables:
    - id: $$cap_public_host
      label: Public Obico hostname
      description: Public hostname only, without http://, https://, path, or trailing slash. Example: obico.example.com
      validRegex: /^[A-Za-z0-9.-]+$/

    - id: $$cap_postgres_password
      label: PostgreSQL password
      defaultValue: $$cap_gen_random_hex(24)
      description: Password for the bundled Obico PostgreSQL database.
      validRegex: /.{12,}/

    - id: $$cap_redis_password
      label: Redis password
      defaultValue: $$cap_gen_random_hex(24)
      description: Password for the bundled Redis instance.
      validRegex: /.{12,}/

    - id: $$cap_django_secret_key
      label: Django secret key
      defaultValue: $$cap_gen_random_hex(48)
      description: Secret key used by the Obico Django backend.
      validRegex: /.{32,}/

    - id: $$cap_ml_api_token
      label: ML API token
      defaultValue: $$cap_gen_random_hex(32)
      description: Shared authentication token between the Obico backend and ML API.
      validRegex: /.{16,}/

    - id: $$cap_default_from_email
      label: Default sender email
      defaultValue: changeme@example.com
      description: Sender address used by Obico. Can be changed later in CapRover.
      validRegex: /.{1,}/

    - id: $$cap_email_host
      label: SMTP host (optional)
      defaultValue: ''
      description: SMTP server hostname. Leave blank if email is not configured yet.
      validRegex: /.{0,}/

    - id: $$cap_email_host_user
      label: SMTP username (optional)
      defaultValue: ''
      description: SMTP username. Leave blank if email is not configured yet.
      validRegex: /.{0,}/

    - id: $$cap_email_host_password
      label: SMTP password (optional)
      defaultValue: ''
      description: SMTP password. Leave blank if email is not configured yet.
      validRegex: /.{0,}/

    - id: $$cap_email_port
      label: SMTP port
      defaultValue: '587'
      validRegex: /^[0-9]+$/

    - id: $$cap_email_use_tls
      label: Use SMTP TLS
      defaultValue: 'True'
      validRegex: /^(True|False)$/

  instructions:
    start: |-
      Deploy a complete Obico server stack on CapRover.

      Enter the public hostname that will be used for the Obico backend, for example obico.example.com.
      Do not include https:// or a trailing slash.

      This template creates five services automatically:
      - PostgreSQL
      - Redis
      - Obico backend
      - Obico worker
      - Obico ML API

      Backend and ML API images are pulled from the public GHCR packages maintained by this repository.
      PostgreSQL and Redis use official upstream images and persistent CapRover volumes.
    end: |-
      Obico has been deployed.

      The public web service is $$cap_appname-backend and listens internally on port 3334.
      Configure $$cap_public_host as the domain for that app and enable HTTPS in CapRover.

      The Django Site record and CSRF trusted origin are configured automatically from the supplied hostname.

      PostgreSQL, Redis, worker and ML API are internal-only services.
      PostgreSQL and Redis data are stored in persistent volumes.

  displayName: Obico
  isOfficial: false
  description: Self-hosted Obico server with PostgreSQL, Redis, backend, worker and ML API for CapRover.
  documentation: https://github.com/TylonHH/obico-caprover
